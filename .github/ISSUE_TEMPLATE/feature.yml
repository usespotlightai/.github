name: Feature
description: A new capability.
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is slow, difficult or not possible now.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you want Spotlight to do.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions you considered.
