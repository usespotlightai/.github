name: Bug
description: Something does not work as documented.
type: Bug
projects: ["usespotlightai/1"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened in its place.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: version
    attributes:
      label: Version
      description: Spotlight version, or the commit you run.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove secrets before you paste.
      render: text
